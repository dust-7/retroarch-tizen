name: Build core

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        type: string
        default: 'gambatte'
      repo:
        required: true
        type: string
        default: 'gambatte-libretro'
      subdir:
        required: false
        type: string
        default: ''
      makefile:
        required: false
        type: string
        default: ''
      extra_flags:
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      name:
        required: true
        type: string
      repo:
        required: true
        type: string
      subdir:
        required: false
        type: string
      makefile:
        required: false
        type: string
      extra_flags:
        required: false
        type: string
      use_cached_core:
        required: false
        type: boolean
        default: true

env:
  CORE_ZIP: ${{ inputs.name }}_libretro.zip

jobs:
  restore-core:
    runs-on: ubuntu-latest
    if: inputs.use_cached_core
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Restore core from cache
        id: restore-core
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          key: core-${{ inputs.name }}-${{ github.run_id }}
          restore-keys: |
            core-${{ inputs.name }}-

      - name: Upload core as artifact
        id: artifact
        uses: actions/upload-artifact@v7
        if: steps.restore-core.outputs.cache-hit != ''
        with:
          name: core-${{ inputs.name }}
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          retention-days: 1

  build:
    needs: restore-core
    runs-on: ubuntu-24.04
    if: always() && !cancelled() && needs.restore-core.outputs.artifact-id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore emscripten from cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emscripten.zip
          key: emscripten

      - name: Build core
        id: build
        env:
          NAME: ${{ inputs.name }}
          REPO: ${{ inputs.repo }}
          SUBDIR: ${{ inputs.subdir }}
          MAKEFILE: ${{ inputs.makefile }}
          EXTRA_FLAGS: ${{ inputs.extra_flags }}
        run: |
          chmod +x scripts/build-core.sh
          scripts/build-core.sh "$NAME" "$REPO" "$SUBDIR" "$MAKEFILE" "$EXTRA_FLAGS"

      - name: Save core to cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          key: core-${{ inputs.name }}-${{ github.run_id }}

      - name: Upload core as artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ inputs.name }}
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          retention-days: 1
