name: Build core

on:
  workflow_dispatch:
    inputs:
      name:
        required: true
        type: string
        default: 'gambatte'
      repo:
        required: true
        type: string
        default: 'gambatte-libretro'
      subdir:
        required: false
        type: string
        default: ''
      makefile:
        required: true
        type: string
        default: 'Makefile.libretro'
      extra_flags:
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      name:
        required: true
        type: string
      repo:
        required: true
        type: string
      subdir:
        required: false
        type: string
      makefile:
        required: true
        type: string
      extra_flags:
        required: false
        type: string
      use_cached_core:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CORE_ZIP: ${{ inputs.name }}_libretro.zip
    steps:
      - name: Restore core from cache
        if: inputs.use_cached_core
        id: restore-core
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          key: core-${{ inputs.name }}-${{ github.run_id }}
          restore-keys: |
            core-${{ inputs.name }}-

      - name: Check if core was restored
        if: steps.restore-core.outputs.cache-matched-key != ''
        run: echo "CORE_RESTORED=true" >> "$GITHUB_ENV"

      - name: Checkout repository
        if: env.CORE_RESTORED != 'true'
        uses: actions/checkout@v7

      - name: Restore emscripten from cache
        if: env.CORE_RESTORED != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emscripten.zip
          key: emscripten

      - name: Build core
        if: env.CORE_RESTORED != 'true'
        id: build
        env:
          NAME: ${{ inputs.name }}
          REPO: ${{ inputs.repo }}
          SUBDIR: ${{ inputs.subdir }}
          MAKEFILE: ${{ inputs.makefile }}
          EXTRA_FLAGS: ${{ inputs.extra_flags }}
        run: |
          chmod +x scripts/build-core.sh
          scripts/build-core.sh "$NAME" "$REPO" "$SUBDIR" "$MAKEFILE" "$EXTRA_FLAGS"

      - name: Save core to cache
        if: env.CORE_RESTORED != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          key: core-${{ inputs.name }}-${{ github.run_id }}

      - name: Upload core as artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ inputs.name }}
          path: ${{ runner.temp }}/${{ env.CORE_ZIP }}
          retention-days: 1
