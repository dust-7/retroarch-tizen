name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        default: '0.1.0'
      draft:
        required: false
        type: boolean
        default: true
      use_cached_dummy:
        required: false
        type: boolean
        default: true
      use_cached_bundle:
        required: false
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ inputs.version }}
      use_cached_dummy: ${{ inputs.use_cached_dummy }}
      use_cached_bundle: ${{ inputs.use_cached_bundle }}

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: RetroArch.wgt

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv RetroArch.wgt "RetroArch_v${{ inputs.version }}.wgt"
          gh release create v"${{ inputs.version }}" "RetroArch_v${{ inputs.version }}.wgt" \
            --draft=${{ inputs.draft }} \
            --target "${{ github.ref_name }}" \
            --title "Release v${{ inputs.version }}" \
            --generate-notes
