name: Build app

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      version:
        required: true
        type: string
        default: '0.1.0'
      use_cached_dummy:
        required: false
        type: boolean
        default: true
      use_cached_bundle:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore dummy core from cache
        if: inputs.use_cached_dummy
        id: restore-dummy
        uses: actions/cache/restore@v6
        with:
          path: |
            app/retroarch.js
            app/retroarch.wasm
          key: core-dummy-${{ github.run_id }}
          restore-keys: |
            core-dummy-

      - name: Restore emscripten from cache
        if: inputs.use_cached_dummy != true || steps.restore-dummy.outputs.cache-hit == ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/emscripten.zip
          key: emscripten

      - name: Restore bundle from cache
        if: inputs.use_cached_bundle
        id: restore-bundle
        uses: actions/cache/restore@v6
        with:
          path: app/assets/frontend/bundle.zip
          key: bundle-${{ github.run_id }}
          restore-keys: |
            bundle-

      - name: Restore Tizen Studio installer from cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tizen-studio_6.0.bin
          key: tizen-studio_6.0

      - name: Build app
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x scripts/build-app.sh
          scripts/build-app.sh "$VERSION"

      - name: Save dummy core to cache
        if: inputs.use_cached_dummy != true || steps.restore-dummy.outputs.cache-hit == ''
        uses: actions/cache/save@v6
        with:
          path: |
            app/retroarch.js
            app/retroarch.wasm
          key: core-dummy-${{ github.run_id }}

      - name: Save bundle to cache
        if: inputs.use_cached_bundle != true || steps.restore-bundle.outputs.cache-hit == ''
        uses: actions/cache/save@v6
        with:
          path: app/assets/frontend/bundle.zip
          key: bundle-${{ github.run_id }}

      - name: Upload app as artifact
        uses: actions/upload-artifact@v7
        with:
          name: RetroArch.wgt
          path: app/.buildResult/RetroArch.wgt
          retention-days: 1
