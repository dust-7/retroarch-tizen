name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      use_cached_cores:
        required: false
        type: boolean
        default: true
      use_cached_content:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  list-cores:
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.read.outputs.cores }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get list of cores
        id: read
        run: echo "cores=$(jq -c '.' scripts/cores.json)" >> $GITHUB_OUTPUT

      - name: Check if emscripten is cached
        id: check-emscripten
        uses: actions/cache/restore@v6
        with:
          path: emscripten.zip
          key: emscripten
          lookup-only: true

      - name: Download emscripten
        if: steps.check-emscripten.outputs.cache-hit != 'true'
        run: |
          # SDK 1.39.4.7 from https://developer.samsung.com/smarttv/develop/extension-libraries/webassembly/download.html
          curl -L -o emscripten.zip https://developer.samsung.com/smarttv/file/a5013a65-af11-4b59-844f-2d34f14d19a9

      - name: Save emscripten to cache
        if: steps.check-emscripten.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: emscripten.zip
          key: emscripten

  build-cores:
    needs: list-cores
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.list-cores.outputs.cores) }}
    uses: ./.github/workflows/build-core.yml
    with:
      name: ${{ matrix.item.name }}
      repo: ${{ matrix.item.repo }}
      subdir: ${{ matrix.item.subdir }}
      makefile: ${{ matrix.item.makefile }}
      extra_flags: ${{ matrix.item.extraFlags }}
      use_cached_core: ${{ inputs.use_cached_cores }}

  bundle-files:
    needs: build-cores
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download core artifacts
        uses: actions/download-artifact@v8
        with:
          path: site/cores
          pattern: core-*
          merge-multiple: true

      - name: Create .index-extended
        run: |
          cd site/cores
          for f in *.zip; do
            date=$(date -r "$f" +%Y-%m-%d)
            crc=$(unzip -lv "$f" | awk 'NR==4 {print $7}')
            echo "$date $crc $f"
          done > .index-extended

      - name: Restore content from cache
        if: inputs.use_cached_content
        id: restore-content
        uses: actions/cache/restore@v6
        with:
          path: site/assets/cores
          key: content-${{ github.run_id }}
          restore-keys: |
            content-

      - name: Add content
        if: inputs.use_cached_content != true || steps.restore-content.outputs.cache-matched-key == ''
        run: |
          curl -L -o "$RUNNER_TEMP/nightly.7z" https://buildbot.libretro.com/nightly/emscripten/RetroArch.7z
          7z x "$RUNNER_TEMP/nightly.7z" -o"$RUNNER_TEMP/nightly"
          while IFS= read -r folder; do
            cp -r "$RUNNER_TEMP/nightly/retroarch/assets/cores/$folder" site/assets/cores/
          done < site/assets/cores/.index-dirs

      - name: Save content to cache
        if: inputs.use_cached_content != true || steps.restore-content.outputs.cache-matched-key == ''
        uses: actions/cache/save@v6
        with:
          path: site/assets/cores
          key: content-${{ github.run_id }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    if: ${{ !cancelled() && needs.bundle-files.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: bundle-files
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
